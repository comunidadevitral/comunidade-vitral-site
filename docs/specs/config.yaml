schema: spec-driven

context: |
  Site estático da Comunidade Vitral (Igreja Presbiteriana Independente Vitral), da IPIB, em São José do Rio Preto/SP.
  Stack: HTML5 + CSS puro, sem build step e sem dependências de runtime. JS mínimo (js/menu.js).
  Publicação: GitHub Pages serve a raiz da branch homologacao (subpath /comunidadevitral/); main só em deploy explícito.
  Arquitetura atual: 9 páginas de conteúdo + 404 (index, quem-somos, no-que-cremos, jornada,
  encontros-e-pgs, grande-banquete, criancas-e-familia, causas-e-cidade, contato).
  Fonte da verdade do conteúdo: docs/conteudo/novo/*.md; a Home em docs/conteudo/homepage.md.
  Conteúdo institucional preservado verbatim: telefone 17 99619-5302, e-mail contato@comunidadevitral.com.br,
  endereço Avenida Sebastião Tavares da Silva 1191, CEP 15061-660, CNPJ 49.075.286/0001-63, PIX financeiro@comunidadevitral.com.br,
  WhatsApp institucional https://wa.me/5517996195302.
  Design system "Marca Nova" em css/tokens.css (verde petróleo #005f6b + sálvia #94a69a, gemas safira/esmeralda/âmbar/rubi; Montserrat).
  Header e footer são repetidos em todas as páginas — alterar exige atualizar todas.
  Mobile-first; acessibilidade WCAG 2.1 AA; idioma pt-BR.
  Convenção de commit: "salva" = commit e push na branch homologacao.

rules:
  proposal:
    - Mantenha a proposta focada em verdade de produto e escopo; sem decisões visuais detalhadas
  tasks:
    - Marque tasks [x] apenas quando o trabalho está entregue no código

operations:
  apply:
    guidance:
      - "Site estático: verifique as páginas afetadas e o conteúdo verbatim antes de fechar"
  archive:
    guidance:
      - "Confirme que a spec sincronizada reflete a arquitetura publicada (9 páginas de conteúdo)"
